# Publishes specdrive-cli to npm using Trusted Publishing (OIDC).
#
# No long-lived npm token is used or required. GitHub Actions proves this
# workflow's identity to npm with a short-lived, workflow-specific OIDC token,
# so there is no credential to leak, rotate, or wait to expire.
#
# Release flow:
#   1. npm version patch|minor|major --no-git-tag-version
#   2. git add -A && git commit -m "chore: release vX.Y.Z"
#   3. git tag vX.Y.Z && git push origin main && git push origin vX.Y.Z
#   4. CI STAGES the version. Approve it with 2FA to make it live:
#        npm stage list specdrive-cli     -> note the stage id
#        npm stage approve <stage-id>     -> prompts for your 2FA code
#      or approve it on npmjs.com -> specdrive-cli -> Staged Packages.
#
# Why staging instead of a GitHub environment: GitHub only allows environments on
# public repos for Free accounts, and this repo is private. An `environment:` entry
# would auto-create an environment with NO protection rules and the gate would
# silently do nothing. Staging gives the same guarantee with no plan requirement.
#
# One-time setup on npmjs.com (see docs/releasing.md):
#   Package Settings -> Trusted publishing -> Add trusted publisher -> GitHub Actions
#     Organization or user : kenule500
#     Repository           : SpecDrive
#     Workflow filename    : publish.yml      (filename only, no path)
#     Environment name     : (leave blank - there is no GitHub environment)
#     Allowed actions      : do NOT enable direct `npm publish` - stage-only IS the gate

name: Publish to npm

on:
  push:
    tags:
      - 'v*'

# Required for OIDC. `contents: read` is enough to check out the tag.
# Note: do NOT add a `workflow_dispatch` trigger - npm validates the calling
# workflow's filename, which can silently break the trusted publisher match.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest

    # No `environment:` here on purpose. GitHub only permits environments on public
    # repos for Free accounts; on this private repo one would be auto-created with no
    # protection rules, so the gate would silently do nothing. The gate is npm's
    # staging queue instead - see the `npm stage publish` step below.
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v6

      - name: Set up Node.js and the npm registry
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # Never cache in a release build: a stale cache could change what we ship.
          package-manager-cache: false

      - name: Ensure npm supports Trusted Publishing (>= 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version

      # The release job is also the last chance to catch a broken build. It runs
      # the same checks as CI before the version can be staged.
      - name: Install dependencies
        run: npm ci

      - name: Run the CI checks
        run: npm run ci

      - name: Verify the tag matches package.json
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json : $PKG_VERSION"
          echo "git tag      : $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match package.json version '$PKG_VERSION'. Refusing to publish."
            exit 1
          fi

      - name: Review the exact package contents
        run: npm pack --dry-run

      # Stage-only. The trusted publisher is NOT allowed to publish directly, so
      # this lands the version in npm's staging queue rather than on the registry.
      # A maintainer must approve it with 2FA before it becomes public - that
      # approval is the release gate.
      - name: Stage the release for 2FA approval
        run: npm stage publish
